<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
 <link rel="icon" type="image/png" href="https://i.postimg.cc/JhkxQHWc/jakereal.jpg" />
  <title>MrGreens Vibecoded Google Meet</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    h1 {
      margin-bottom: 20px;
    }

    .controls-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      margin-bottom: 25px;
      background: #1e1e1e;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 400px;
    }

    .action-row {
      display: flex;
      gap: 10px;
      width: 100%;
      justify-content: center;
    }

    input {
      padding: 10px 15px;
      font-size: 16px;
      border: 1px solid #333;
      border-radius: 6px;
      outline: none;
      background-color: #2a2a2a;
      color: #fff;
      text-align: center;
      letter-spacing: 2px;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      background-color: #007bff;
      color: white;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #0056b3;
    }

    button.secondary {
      background-color: #28a745;
    }
    button.secondary:hover {
      background-color: #218838;
    }

    #roomDisplay {
      font-size: 18px;
      font-weight: bold;
      color: #4cd137;
      margin-top: 5px;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 1000px;
    }

    .video-card {
      position: relative;
      background-color: #1e1e1e;
      border-radius: 12px;
      overflow: hidden;
      aspect-ratio: 16 / 9;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .label {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background-color: rgba(0, 0, 0, 0.6);
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <h1>Video Call App</h1>

  <div class="controls-container" id="setupContainer">
    <!-- Host Section -->
    <button id="hostBtn" class="secondary">Host a Room</button>
    <div id="roomDisplay"></div>

    <hr style="width:100%; border:0; border-top:1px solid #333; margin: 5px 0;">

    <!-- Join Section -->
    <div class="action-row">
      <input type="text" id="roomIdInput" placeholder="Enter 4-Digit Code" maxlength="4" />
      <button id="joinBtn">Join Room</button>
    </div>
  </div>

  <div class="video-grid">
    <div class="video-card">
      <video id="localVideo" autoplay playsinline muted></video>
      <div class="label">You</div>
    </div>
    <div class="video-card">
      <video id="remoteVideo" autoplay playsinline></video>
      <div class="label">Peer</div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    const localVideo = document.getElementById('localVideo');
    const remoteVideo = document.getElementById('remoteVideo');
    const roomIdInput = document.getElementById('roomIdInput');
    const joinBtn = document.getElementById('joinBtn');
    const hostBtn = document.getElementById('hostBtn');
    const roomDisplay = document.getElementById('roomDisplay');
    const setupContainer = document.getElementById('setupContainer');

    let localStream;
    let peerConnection;
    let roomId;

    const rtcConfig = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' }
      ]
    };

    // Initialize Camera/Mic
    async function initLocalStream() {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        localVideo.srcObject = localStream;
      } catch (err) {
        console.error('Error accessing media devices:', err);
        alert('Could not access camera or microphone.');
      }
    }

    initLocalStream();

    // Host Action: Generate random 4-digit code
    hostBtn.addEventListener('click', () => {
      roomId = Math.floor(1000 + Math.random() * 9000).toString();
      roomDisplay.innerText = `Your Room Code: ${roomId}`;
      
      socket.emit('join-room', roomId);
      
      hostBtn.disabled = true;
      joinBtn.disabled = true;
      roomIdInput.disabled = true;
    });

    // Join Action: Enter 4-digit code
    joinBtn.addEventListener('click', () => {
      roomId = roomIdInput.value.trim();
      if (roomId.length !== 4) {
        return alert('Please enter a valid 4-digit code.');
      }
      
      socket.emit('join-room', roomId);
      
      roomDisplay.innerText = `Connected to Room: ${roomId}`;
      hostBtn.disabled = true;
      joinBtn.disabled = true;
      roomIdInput.disabled = true;
    });

    // When another peer connects to the room
    socket.on('user-connected', async (peerId) => {
      createPeerConnection(peerId);

      const offer = await peerConnection.createOffer();
      await peerConnection.setLocalDescription(offer);

      socket.emit('offer', {
        target: peerId,
        sdp: offer
      });
    });

    socket.on('offer', async (data) => {
      createPeerConnection(data.caller);

      await peerConnection.setRemoteDescription(new RTCSessionDescription(data.sdp));
      const answer = await peerConnection.createAnswer();
      await peerConnection.setLocalDescription(answer);

      socket.emit('answer', {
        target: data.caller,
        sdp: answer
      });
    });

    socket.on('answer', async (data) => {
      await peerConnection.setRemoteDescription(new RTCSessionDescription(data.sdp));
    });

    socket.on('ice-candidate', async (data) => {
      try {
        if (peerConnection) {
          await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
        }
      } catch (e) {
        console.error('Error adding ICE candidate:', e);
      }
    });

    socket.on('user-disconnected', () => {
      if (remoteVideo.srcObject) {
        remoteVideo.srcObject.getTracks().forEach(track => track.stop());
        remoteVideo.srcObject = null;
      }
      if (peerConnection) {
        peerConnection.close();
        peerConnection = null;
      }
      alert('The other user has left the call.');
    });

    function createPeerConnection(peerId) {
      peerConnection = new RTCPeerConnection(rtcConfig);

      localStream.getTracks().forEach(track => {
        peerConnection.addTrack(track, localStream);
      });

      peerConnection.ontrack = (event) => {
        if (remoteVideo.srcObject !== event.streams[0]) {
          remoteVideo.srcObject = event.streams[0];
        }
      };

      peerConnection.onicecandidate = (event) => {
        if (event.candidate) {
          socket.emit('ice-candidate', {
            target: peerId,
            candidate: event.candidate
          });
        }
      };
    }
  </script>
</body>
</html>
